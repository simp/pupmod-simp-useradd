---
# Restores the behavior of useradd 3.x when enforced with
#
#   compliance_engine::enforcement:
#     - simp:defaults
#
# Values set in site Hiera take precedence over these.
version: 2.0.0
checks:
  simp:defaults.useradd.securetty_entries:
    type: puppet-class-parameter
    settings:
      parameter: useradd::securetty_entries
      value:
        tty0: {}
        tty1: {}
        tty2: {}
        tty3: {}
        tty4: {}
  simp:defaults.useradd.purge_securetty:
    type: puppet-class-parameter
    settings:
      parameter: useradd::purge_securetty
      value: true
  simp:defaults.useradd.securetty_mode:
    type: puppet-class-parameter
    settings:
      parameter: useradd::securetty_mode
      value: '0400'
  simp:defaults.useradd.shells_entries:
    type: puppet-class-parameter
    settings:
      parameter: useradd::shells_entries
      value:
        /bin/sh: {}
        /bin/bash: {}
        /sbin/nologin: {}
        /usr/bin/sh: {}
        /usr/bin/bash: {}
        /usr/sbin/nologin: {}
  simp:defaults.useradd.purge_shells:
    type: puppet-class-parameter
    settings:
      parameter: useradd::purge_shells
      value: true
  simp:defaults.useradd.shells_mode:
    type: puppet-class-parameter
    settings:
      parameter: useradd::shells_mode
      value: '0644'
  simp:defaults.useradd.login_defs.encrypt_method:
    type: puppet-class-parameter
    settings:
      parameter: useradd::login_defs::encrypt_method
      value: SHA512
  simp:defaults.useradd.login_defs.chfn_auth:
    type: puppet-class-parameter
    settings:
      parameter: useradd::login_defs::chfn_auth
      value: false
  simp:defaults.useradd.login_defs.chfn_restrict:
    type: puppet-class-parameter
    settings:
      parameter: useradd::login_defs::chfn_restrict
      value: frwh
  simp:defaults.useradd.login_defs.chsh_auth:
    type: puppet-class-parameter
    settings:
      parameter: useradd::login_defs::chsh_auth
      value: false
  simp:defaults.useradd.login_defs.create_home:
    type: puppet-class-parameter
    settings:
      parameter: useradd::login_defs::create_home
      value: true
  simp:defaults.useradd.login_defs.default_home:
