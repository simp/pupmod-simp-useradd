    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::userdefaults
      value: "LU_USERNAME = %n\nLU_GIDNUMBER = %u"
  simp:defaults.useradd.libuser_conf.groupdefaults:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::groupdefaults
      value: LU_GROUPNAME = %n
  simp:defaults.useradd.libuser_conf.mode:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::mode
      value: '0644'
  simp:defaults.useradd.libuser_conf.purge:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::purge
      value: true
  simp:defaults.useradd.passwd.files:
    type: puppet-class-parameter
    settings:
      parameter: useradd::passwd::files
      value:
        /etc/passwd:
          owner: root
          group: root
          mode: '0644'
        /etc/passwd-:
          owner: root
          group: root
          mode: '0644'
        /etc/group:
          owner: root
          group: root
          mode: '0644'
        /etc/group-:
          owner: root
          group: root
          mode: '0644'
        /etc/shadow:
          owner: root
          group: root
          mode: '0000'
        /etc/shadow-:
          owner: root
          group: root
          mode: '0000'
        /etc/gshadow:
          owner: root
          group: root
          mode: '0000'
        /etc/gshadow-:
          owner: root
          group: root
          mode: '0000'
