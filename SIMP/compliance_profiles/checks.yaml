    type: puppet-class-parameter
    settings:
      parameter: useradd::useradd::create_mail_spool
      value: true
  simp:defaults.useradd.useradd.mode:
    type: puppet-class-parameter
    settings:
      parameter: useradd::useradd::mode
      value: '0600'
  simp:defaults.useradd.useradd.purge:
    type: puppet-class-parameter
    settings:
      parameter: useradd::useradd::purge
      value: true
  simp:defaults.useradd.libuser_conf.defaults_modules:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::defaults_modules
      value:
      - files
      - shadow
  simp:defaults.useradd.libuser_conf.defaults_create_modules:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::defaults_create_modules
      value:
      - files
      - shadow
  simp:defaults.useradd.libuser_conf.defaults_crypt_style:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::defaults_crypt_style
      value: sha512
  simp:defaults.useradd.libuser_conf.import_login_defs:
    type: puppet-class-parameter
    settings:
      parameter: useradd::libuser_conf::import_login_defs
