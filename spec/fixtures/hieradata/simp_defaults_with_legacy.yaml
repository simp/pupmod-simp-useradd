---
compliance_engine::enforcement:
  - simp:defaults
# A site still setting the deprecated 3.x parameters. They own their whole
# file, as in 3.x, so the profile's entries and purge are ignored for it.
useradd::securetty: []
useradd::shells: false
useradd::libuser_conf::userdefaults: LU_USERNAME = %n
useradd::etc_profile::prepend:
  sh: echo pre
